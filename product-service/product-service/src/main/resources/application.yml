server:
  port: 8082

spring:
  application:
    name: product-service   # tên service đăng ký trên Consul, phải trùng với gateway gọi

  config:
    import:
      optional:consul:
  cloud:
    consul:
      host: localhost    # địa chỉ Consul server
      port: 8500
      discovery:
        register: true   # đăng ký service lên Consul
        enabled: true
        prefer-ip-address: true  # dùng IP thay vì hostname (nên dùng khi trong Docker hoặc mạng LAN)
  datasource:
    url: jdbc:postgresql://localhost:5432/proshop_product
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
